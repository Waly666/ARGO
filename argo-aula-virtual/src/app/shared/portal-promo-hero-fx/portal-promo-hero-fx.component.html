<div class="pp-hero-fx" [style.--pp-fx-accent-rgb]="accentRgb()">

  <div class="pp-hero-fx__glow pp-hero-fx__glow--a" aria-hidden="true"></div>
  <div class="pp-hero-fx__glow pp-hero-fx__glow--b" aria-hidden="true"></div>
  <div class="pp-hero-fx__scan" aria-hidden="true"></div>
  <div class="pp-hero-fx__radar" aria-hidden="true">
    <div class="pp-hero-fx__radar-core"></div>
    <span class="pp-hero-fx__radar-sweep"></span>
    <span class="pp-hero-fx__radar-ring"></span>
    <span class="pp-hero-fx__radar-ring"></span>
    <span class="pp-hero-fx__radar-ring"></span>
    <span class="pp-hero-fx__radar-dot"></span>
  </div>
</div>
