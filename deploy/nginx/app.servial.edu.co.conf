# ERP SERVIAL — proxy al contenedor argo-servial-frontend (:8093)
# /api/ y /uploads/ los reenvía el nginx interno del contenedor → argo-servial-backend
# Copiar a /etc/nginx/sites-available/app.servial.edu.co.conf
# Luego ejecutar: sudo bash deploy/setup-nginx-ssl-servial.sh (añade HTTPS / Certbot)

server {
    listen 80;
    listen [::]:80;
    server_name app.servial.edu.co;

    client_max_body_size 400m;
    include /opt/argo-servial/deploy/nginx/snippets/argo-security-headers.conf;

    location / {
        client_max_body_size 400m;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
