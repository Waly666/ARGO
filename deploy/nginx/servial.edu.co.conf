# Portal SERVIAL — SPA en :8095; API/uploads directo al backend :5012
# Copiar a /etc/nginx/sites-available/servial.edu.co.conf
# include paths: /opt/argo-servial/deploy/nginx/snippets/

server {
    listen 80;
    listen [::]:80;
    server_name servial.edu.co www.servial.edu.co;

    client_max_body_size 400m;
    include /opt/argo-servial/deploy/nginx/snippets/argo-security-headers.conf;

    location /api/ {
        client_max_body_size 400m;
        proxy_pass http://127.0.0.1:5012/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5012/uploads/;
        include /opt/argo-servial/deploy/nginx/snippets/argo-uploads-proxy.conf;
    }

    location /socket.io/ {
        include /opt/argo-servial/deploy/nginx/snippets/argo-websocket-proxy.conf;
        proxy_pass http://127.0.0.1:5012/socket.io/;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5012/api/aula-virtual/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
