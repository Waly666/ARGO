<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARGO Mobile Build Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 2L3 7v10l9 5 9-5V7l-9-5z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <path d="M12 12l9-5M12 12L3 7M12 12v10" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </div>
          <div>
            <p class="brand-kicker">ARGO DevTools</p>
            <h1 class="brand-title">Build Studio</h1>
          </div>
        </div>

        <p class="sidebar-label">Aplicaciones móviles</p>
        <nav class="app-nav" id="tabs" aria-label="Seleccionar app"></nav>

        <div class="sidebar-divider"></div>

        <p class="sidebar-label">Acciones globales</p>
        <div class="sidebar-actions">
          <button type="button" id="btnApplyAll" class="btn btn-outline">
            <span class="btn-icon">⟳</span>
            Aplicar las 3
          </button>
          <button type="button" id="btnBuildAll" class="btn btn-primary">
            <span class="btn-icon">▶</span>
            Build producción ×3
          </button>
        </div>

        <div class="sidebar-foot">
          <span class="badge badge-dev">Solo desarrollo local</span>
          <span class="badge badge-secure">127.0.0.1</span>
        </div>
      </aside>

      <main class="main">
        <header class="page-header" id="pageHeader"></header>

        <div class="content">
          <section id="panel" class="panel" aria-live="polite"></section>

          <aside class="summary" id="summary"></aside>
        </div>

        <section class="terminal" aria-label="Salida del build">
          <div class="terminal-head">
            <div class="terminal-title">
              <span class="terminal-dot" id="terminalDot"></span>
              <h2>Consola EAS</h2>
            </div>
            <div class="terminal-actions">
              <span class="terminal-status" id="terminalStatus">En espera</span>
              <button type="button" id="btnClearLog" class="btn btn-ghost btn-sm">Limpiar</button>
            </div>
          </div>
          <pre id="log" class="terminal-body">Listo. Selecciona una app, edita el perfil y lanza un build.</pre>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
