<argo-head-alarm-list-banner
  [visible]="visible()"
  theme="hal-theme-aula"
  icon="👤"
  [title]="'Nuevo registro en aula virtual (' + rows().length + ')'"
  hint="Pulse una fila para ver usuarios del portal."
  [items]="rows()"
  [itemDismissible]="true"
  (closed)="cerrar()"
  (itemClick)="onItemClick($event)"
  (itemDismiss)="onItemDismiss($event)"
/>
