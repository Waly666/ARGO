<argo-head-alarm-list-banner
  [visible]="visible()"
  theme="hal-theme-aula"
  icon="📚"
  [title]="'Nueva matrícula en curso virtual (' + rows().length + ')'"
  hint="Pulse una fila para ver alumnos del curso."
  [items]="rows()"
  [itemDismissible]="true"
  (closed)="cerrar()"
  (itemClick)="onItemClick($event)"
  (itemDismiss)="onItemDismiss($event)"
/>
