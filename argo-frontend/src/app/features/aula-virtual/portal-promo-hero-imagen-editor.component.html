<div class="pgh">
  <span class="pgh__label">{{ label }}</span>
  <p class="psb-hint">
    Foto del héroe en <strong>{{ routePath }}</strong>. Se guarda al instante. PNG, JPG o WEBP. Máx. 8 MB.
  </p>

  <div class="pgh__row">
    @if (heroPreviewUrl(); as heroUrl) {
      <figure class="pgh__preview">
        <img [src]="heroUrl" [alt]="heroAltText() || 'Vista previa del héroe'" />
      </figure>
    } @else {
      <div class="pgh__preview pgh__preview--empty">{{ emptyHint }}</div>
    }

    <div class="pgh__actions">
      <label class="psb-btn psb-btn--file" [class.psb-btn--disabled]="heroUploading()">
        {{ heroUploading() ? 'Subiendo…' : 'Elegir imagen' }}
        <input
          type="file"
          accept="image/png,image/jpeg,image/webp"
          hidden
          (change)="onHeroImagen($event)"
          [disabled]="heroUploading()"
        />
      </label>
      @if (tieneImagenHero()) {
        <button type="button" class="psb-btn psb-btn--ghost" [disabled]="heroUploading()" (click)="quitarImagenHero()">
          Quitar imagen
        </button>
      }
    </div>
  </div>

  <label class="psb-field psb-field--plain">
    <span>Texto alternativo de la imagen (accesibilidad)</span>
    <input
      type="text"
      class="psb-input"
      [ngModel]="heroAltText()"
      (ngModelChange)="onHeroAltChange($event)"
      placeholder="Ej. Equipo de formación en seguridad vial"
    />
  </label>
</div>
